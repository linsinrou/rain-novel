<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>小說藏書館</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <header class="site-header">
    <a class="logo" href="index.html">
      <span class="logo-symbol">梟</span>

      <span>
        <strong>小說藏書館</strong>
        <small>NOVEL LIBRARY</small>
      </span>
    </a>

    <button id="themeButton" class="theme-button" type="button">
      <span id="themeIcon">☀</span>
      <span id="themeText">亮色</span>
    </button>
  </header>

  <main>
    <section class="hero">
      <p class="hero-label">STORIES · WORLDS · IMAGINATION</p>
      <h1>尋找你想閱讀的故事</h1>
      <p>輸入書名，從藏書中找到作品。</p>

      <div class="search-box">
        <span aria-hidden="true">⌕</span>

        <input id="bookSearch" type="search" placeholder="搜尋書名" autocomplete="off">

        <button id="clearSearch" type="button" aria-label="清除搜尋">×</button>
      </div>
    </section>

    <section class="library-section">
      <div class="section-heading">
        <div>
          <p>BOOK COLLECTION</p>
          <h2>全部藏書</h2>
        </div>

        <p>共 <strong id="bookCount">0</strong> 本</p>
      </div>

      <div id="bookList" class="book-list"></div>

      <p id="emptyMessage" class="empty-message" hidden>
        找不到符合的作品
      </p>
    </section>
  </main>

  <footer>
    <p>© <span id="currentYear"></span> 小說藏書館</p>
  </footer>
</body>
</html>
